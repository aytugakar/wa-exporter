<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #fdfdfd;
      color: #333;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #075e54;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    fieldset {
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      margin-bottom: 12px;
      padding: 10px;
      background: #fff;
    }
    legend {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      padding: 0 4px;
    }
    .radio-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .radio-label input {
      margin-right: 6px;
    }
    .badge {
      color: #075e54;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-weight: 600;
      font-size: 12px;
      box-sizing: border-box;
    }
    button.primary {
      background: #075e54;
      color: #fff;
      border: none;
      margin-bottom: 12px;
    }
    button.primary:hover {
      background: #054c44;
    }
    button.secondary {
      background: #f1f3f4;
      color: #202124;
      border: 1px solid #dadce0;
    }
    button.secondary:hover {
      background: #e8eaed;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #status {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>WA Contacts Extractor</h3>

  <button id="btnFetch" class="primary">Verileri Çek / Yenile</button>

  <fieldset>
    <legend>1. Kapsam Seçimi</legend>
    <label class="radio-label">
      <input type="radio" name="scope" value="directChats" checked>
      Sadece Sohbetler (<span id="countChats" class="badge">0</span>)
    </label>
    <label class="radio-label">
      <input type="radio" name="scope" value="savedContacts">
      Kayıtlı Rehberim (<span id="countSaved" class="badge">0</span>)
    </label>
    <label class="radio-label">
      <input type="radio" name="scope" value="allDiscovered">
      Gruplar Dahil Tümü (<span id="countAll" class="badge">0</span>)
    </label>
  </fieldset>

  <fieldset>
    <legend>2. Dışa Aktar</legend>
    <button id="btnVCF" class="secondary" disabled>vCard (.vcf) İndir</button>
    <button id="btnCSV" class="secondary" disabled>Google Kişiler (CSV) İndir</button>
  </fieldset>

  <fieldset>
    <legend>Gruplar (<span id="countGroups" class="badge">0</span>)</legend>
    <button id="btnGroupMembers" class="secondary" disabled>Grup Üyelerini İndir (CSV)</button>
  </fieldset>

  <div id="status">WhatsApp Web sekmesinde çalıştırın.</div>
  <script src="popup.js"></script>
</body>
</html>
